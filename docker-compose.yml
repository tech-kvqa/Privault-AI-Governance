# Full stack:   cp .env.docker.example .env   (edit the secrets)   &&   docker compose up --build
# Dev DB only:  docker compose up -d db        (then run server/client on the host; see README)
# NOTE: written but not run in the environment this repo was developed in (no Docker there).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: privault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privault}
      POSTGRES_DB: privault_ai_governance
    ports: ["5432:5432"]
    volumes: [privault_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privault -d privault_ai_governance"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://privault:${POSTGRES_PASSWORD:-privault}@db:5432/privault_ai_governance
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 random chars) in .env}
      WEBHOOK_ENC_KEY: ${WEBHOOK_ENC_KEY:?set WEBHOOK_ENC_KEY in .env}
      PII_INDEX_KEY: ${PII_INDEX_KEY:?set PII_INDEX_KEY in .env}
      SESSION_HOURS: "8"
      SESSION_IDLE_MINUTES: "60"
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      CONNECTOR_ALLOW_PRIVATE: ${CONNECTOR_ALLOW_PRIVATE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      PORT: "4100"
    expose: ["4100"]

  web:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  privault_pg_data:
