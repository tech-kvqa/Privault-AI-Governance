# NOTE: written but not executed in the environment this repo was built in.
name: CI
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/privault_ci
      E2E_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate               # WASM schema engine — no downloads
      - run: bash test/fixtures/setup-pg.sh # bank_demo fixture for the connector tests
      - run: npm test                       # unit + route tests + live-Postgres connector tests + real-stack E2E

  ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      E2E_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: bash test/fixtures/setup-pg.sh
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm test                       # mounts the real app against a real backend it starts itself
        working-directory: client
