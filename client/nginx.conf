server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # API: strip the /api prefix and forward to the backend service.
  location /api/ {
    proxy_pass http://server:4100/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;      # file uploads (evidence 5MB, scans 10MB)
    proxy_read_timeout 320s;       # connector scans run synchronously
  }

  # Single-page app: unknown paths serve index.html
  location / { try_files $uri /index.html; }
}
